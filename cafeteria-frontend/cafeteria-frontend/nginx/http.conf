# Usado cuando NO hay certificado montado en /etc/nginx/certs (desarrollo
# local, docker-compose sin HTTPS). Ver docker-entrypoint.sh.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html para
    # que React Router (BrowserRouter) la resuelva en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
