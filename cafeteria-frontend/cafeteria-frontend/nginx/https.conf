# Usado cuando SI hay un certificado montado en /etc/nginx/certs (ver
# docker-entrypoint.sh y docs/EP2_PLAN.md seccion 8: Terraform monta el
# certificado autofirmado de la EC2 ahi). HTTP en 80 solo redirige a HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
