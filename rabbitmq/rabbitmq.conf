# Compartido por los 3 nodos del cluster (rabbitmq-1/2/3, ver docker-compose.yml
# y docs/EP2_PLAN.md seccion 3 / Fase 2). Peer discovery "classic_config": cada
# nodo, al arrancar con un directorio de datos vacio, descubre y se une a los
# otros nodos listados aqui (el primero en levantar inicializa el cluster).
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3
