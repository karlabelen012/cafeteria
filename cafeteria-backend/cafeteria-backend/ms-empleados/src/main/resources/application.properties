spring.application.name=ms-empleados
server.port=8086

# --- Base de datos (PostgreSQL en AWS RDS) ---
# En local usa el docker-compose.yml incluido en /backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cafeteria}
spring.datasource.username=${DB_USER:cafeteria}
spring.datasource.password=${DB_PASSWORD:cafeteria}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=empleados

# --- Seguridad: validacion de JWT emitido por Azure Entra ID (IDaaS) ---
# Reemplaza <TENANT_ID> por el Directory (tenant) ID de tu Azure Entra ID.
# El issuer-uri permite a Spring descargar automaticamente el JWKS (claves publicas)
# desde https://login.microsoftonline.com/<TENANT_ID>/v2.0/.well-known/openid-configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/<TENANT_ID>/v2.0}
# audience = el Application ID URI que definiste en "Expose an API" del backend
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AUDIENCE:api://cafeteria-backend}

management.endpoints.web.exposure.include=health,info

# Por defecto la seguridad esta activa. Para desactivarla en desarrollo
# local usa el perfil noauth (ver application-noauth.properties).
app.security.enabled=true
