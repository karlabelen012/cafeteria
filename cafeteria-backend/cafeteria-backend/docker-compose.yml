version: "3.8"

# Levanta una base PostgreSQL local para desarrollar y probar los 8 microservicios
# antes de migrar a AWS RDS. Cada microservicio usa su propio esquema dentro
# de la misma base "cafeteria" (ver init-db/01-schemas.sql).
services:
  postgres:
    image: postgres:16-alpine
    container_name: cafeteria-postgres
    environment:
      POSTGRES_DB: cafeteria
      POSTGRES_USER: cafeteria
      POSTGRES_PASSWORD: cafeteria
    ports:
      - "5432:5432"
    volumes:
      - cafeteria_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeteria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cafeteria_pgdata:
